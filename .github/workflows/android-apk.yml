name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: /tmp/flix-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load release signing key
        env:
          FLIX_KEYSTORE_BASE64: ${{ secrets.FLIX_KEYSTORE_BASE64 }}
        run: |
          if test -n "$FLIX_KEYSTORE_BASE64"; then echo "$FLIX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flix-release.jks"; echo "FLIX_KEYSTORE_FILE=$RUNNER_TEMP/flix-release.jks" >> "$GITHUB_ENV";
          else echo "::warning::FLIX_KEYSTORE_BASE64 is not set; the download APK uses a temporary key and will not install over previous versions."; fi
      - name: Build APK, unit tests and lint
        working-directory: android
        env:
          FLIX_KEYSTORE_PASSWORD: ${{ secrets.FLIX_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Install emulator image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n flix-test -p "$ANDROID_AVD_HOME/flix-test.avd" -k "system-images;android-30;google_apis;x86_64" --force
          sudo chmod a+rw /dev/kvm
      - name: Start emulator and test popups with real touches
        working-directory: android
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd flix-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          if test "$GITHUB_EVENT_NAME" = push; then
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.liveCatalog=true
          else
            gradle --no-daemon :app:connectedDebugAndroidTest
          fi
      - name: Collect APK and reports
        if: always()
        run: |
          mkdir -p android/output
          if test -f android/app/build/outputs/apk/debug/app-debug.apk; then cp android/app/build/outputs/apk/debug/app-debug.apk android/output/Flix-Android-teste.apk; fi
          python3 -c 'import glob,os,shutil; paths=glob.glob(os.environ["ANDROID_HOME"]+"/build-tools/*/lib/apksigner.jar"); shutil.copy2(sorted(paths)[-1],"android/output/apksigner.jar") if paths else None'
          timeout 15 adb logcat -d > android/output/emulator-logcat.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flix-Android-teste
          path: |
            android/output/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/connected_android_test_additional_output/
            android/emulator.log
          retention-days: 14
      - name: Publish download release
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publishing with a temporary key would block every later update from installing over it.
          if test -z "$FLIX_KEYSTORE_FILE"; then echo "::warning::Download release skipped until FLIX_KEYSTORE_BASE64 and FLIX_KEYSTORE_PASSWORD are set."; exit 0; fi
          code=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" android/app/build.gradle)
          name=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)
          tag="android-v$code"
          cp android/app/build/outputs/apk/release/app-release.apk Flix.apk
          # The site's /baixar link always points at the latest release asset named Flix.apk.
          if gh release view "$tag" >/dev/null 2>&1; then gh release upload "$tag" Flix.apk --clobber
          else gh release create "$tag" Flix.apk --title "Flix $name" --notes "$(git log -1 --pretty=%s)" --latest; fi
