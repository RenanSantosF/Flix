name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: ${{ runner.temp }}/flix-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK, unit tests and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Install emulator image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-30;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n flix-test -p "$ANDROID_AVD_HOME/flix-test.avd" -k "system-images;android-30;google_apis;x86_64" --force
          sudo chmod a+rw /dev/kvm
      - name: Start emulator and test popups with real touches
        working-directory: android
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd flix-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb shell input keyevent 82
          gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Collect APK and reports
        if: always()
        run: |
          mkdir -p android/output
          if test -f android/app/build/outputs/apk/debug/app-debug.apk; then cp android/app/build/outputs/apk/debug/app-debug.apk android/output/Flix-Android-teste.apk; fi
          adb logcat -d > android/output/emulator-logcat.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flix-Android-teste
          path: |
            android/output/
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/emulator.log
          retention-days: 14
